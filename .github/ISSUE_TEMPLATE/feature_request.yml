name: 功能建议
description: 提出新的功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这个功能解决什么问题、服务什么场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 期望的行为或交互方式（可含 UI 草图、参考软件示例）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他做法及不选用的原因（可选）
